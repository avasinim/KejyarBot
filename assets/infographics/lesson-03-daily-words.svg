<rect width="1200" height="1120" rx="32" fill="url(#bg)"/><rect x="24" y="24" width="1152" height="1072" rx="28" fill="none" stroke="#254b3f" stroke-width="3"/>
<rect x="32" y="32" width="1136" height="165" rx="24" fill="#254b3f"/>
<text x="600" y="91" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">وانەی ٣: وشەکانی ڕۆژانە</text>
<text x="600" y="139" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="22" fill="#e8d2a4">وشەی گونجاو بۆ دۆخی ڕۆژانە هەڵبژێرە</text>
<g><rect x="48" y="225" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="239" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="288" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">داواکردن</text><path d="M83 304 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="328" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">تکایە، دەرگاکە بکەرەوە.</text><text x="318" y="367" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">دەتوانیت یارمەتیم بدەیت؟</text><text x="318" y="406" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">تکایە، دووبارەی بکەرەوە.</text></g><g><rect x="612" y="225" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="239" width="512" height="7" rx="3" fill="#e9b85f"/><text x="882" y="288" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">سوپاس</text><path d="M647 304 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="328" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">سوپاس بۆ یارمەتیت.</text><text x="882" y="367" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">زۆر سوپاس.</text><text x="882" y="406" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">سوپاس، زۆر میهرەبانیت.</text></g><g><rect x="48" y="491" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="505" width="512" height="7" rx="3" fill="#b86d55"/><text x="318" y="554" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">لێبوردن</text><path d="M83 570 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="594" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ببورە، پرسیارێکم هەیە.</text><text x="318" y="633" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ببورە، دواکەوتم.</text><text x="318" y="672" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ببورە، ڕێگام پێ بدە.</text></g><g><rect x="612" y="491" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="505" width="512" height="7" rx="3" fill="#7699a0"/><text x="882" y="554" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">وەڵامی ئەرێنی و نەرێنی</text><path d="M647 570 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="594" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">بەڵێ، فەرموو.</text><text x="882" y="633" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">نەخێر، سوپاس.</text><text x="882" y="672" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">بەڵێ، دەتوانم یارمەتیت بدەم.</text></g><g><rect x="48" y="757" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="771" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="820" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">پێشوازی و ماڵئاوایی</text><path d="M83 836 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="860" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">بەخێربێیت!</text><text x="318" y="899" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">تا دواتر، خواحافیز.</text><text x="318" y="938" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">بەخێر بڕۆیت.</text></g><g><rect x="612" y="757" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="771" width="512" height="7" rx="3" fill="#b86d55"/><text x="882" y="820" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">گفتوگۆی نموونە</text><path d="M647 836 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="860" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">— ببورە، دەتوانم پرسیارێک بکەم؟</text><text x="882" y="899" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">— بەڵێ، فەرموو.</text><text x="882" y="938" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">— سوپاس بۆ یارمەتیت.</text></g>
<text x="600" y="1095" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="17" fill="#64736b">کەژیار • فێربوونی زمانی کوردی بە نموونەی ڕۆژانە</text>
