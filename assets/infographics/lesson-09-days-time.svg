="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ئەمڕۆ • سبەی • دوێنێ</text></g><g><rect x="48" y="491" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="505" width="512" height="7" rx="3" fill="#b86d55"/><text x="318" y="554" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">ڕستەی نموونە</text><path d="M83 570 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="594" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ئەمڕۆ دووشەممەیە.</text><text x="318" y="633" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">سبەی سێشەممەیە.</text><text x="318" y="672" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">شەو کتێبێک دەخوێنمەوە.</text></g><g><rect x="612" y="491" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="505" width="512" height="7" rx="3" fill="#7699a0"/><text x="882" y="554" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">پرسیارکردن</text><path d="M647 570 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="594" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ئەمڕۆ چ ڕۆژێکە؟</text><text x="882" y="633" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">وانەکە کەی 