<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-label="وانەی ٦: لە ماڵ و قوتابخانە">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f5ed"/><stop offset="1" stop-color="#edf0e5"/></linearGradient></defs>
<rect width="1200" height="1120" rx="32" fill="url(#bg)"/><rect x="24" y="24" width="1152" height="1072" rx="28" fill="none" stroke="#254b3f" stroke-width="3"/>
<rect x="32" y="32" width="1136" height="165" rx="24" fill="#254b3f"/>
<text x="600" y="91" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">وانەی ٦: لە ماڵ و قوتابخانە</text>
<text x="600" y="139" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="22" fill="#e8d2a4">ناوی شتەکان، شوێنیان و ڕستەی ڕۆژانە</text>
<g><rect x="48" y="225" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="239" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="288" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">لە ماڵدا</text><path d="M83 304 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="328" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">دەرگا • پەنجەرە • کورسی</text><text x="318" y="367" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">مێز • کتێب • جێخەو</text><text x="318" y="406" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">کلیلی دەرگاکە لەسەر مێزەکەیە.</text></g><g><rect x="612" y="225" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="239" width="512" height="7" rx="3" fill="#e9b85f"/><text x="882" y="288" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">لە قوتابخانەدا</text><path d="M647 304 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="328" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">پێنووس • دەفتەر • جانتا</text><text x="882" y="367" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">تەختە • مامۆستا • کورسی</text><text x="882" y="406" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">مامۆستا لە پۆلەکەدایە.</text></g><g><rect x="48" y="491" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="505" width="512" height="7" rx="3" fill="#b86d55"/><text x="318" y="554" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">شوێن: لەسەر / لەژێر</text><path d="M83 570 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="594" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">کتێبەکە لەسەر مێزەکەیە.</text><text x="318" y="633" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">تۆپەکە لەژێر کورسییەکەیە.</text><text x="318" y="672" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">دەفتەرەکە لە تەنیشت پێنووسەکەیە.</text></g><g><rect x="612" y="491" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="505" width="512" height="7" rx="3" fill="#7699a0"/><text x="882" y="554" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">شوێن: لەناو / لە پشت</text><path d="M647 570 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="594" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">پێنووسەکە لەناو جانتاکەدایە.</text><text x="882" y="633" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">جانتاکە لە پشت دەرگاکەیە.</text><text x="882" y="672" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">کورسییەک لە تەنیشت پەنجەرەکەیە.</text></g><g><rect x="48" y="757" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="771" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="820" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">گفتوگۆی نموونە</text><path d="M83 836 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="860" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">— دەفتەرەکەم لە کوێیە؟</text><text x="318" y="899" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">— لەسەر مێزەکەیە، لە تەنیشت پێنووسەکە.</text><text x="318" y="938" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">— زۆر سوپاس!</text></g><g><rect x="612" y="757" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="771" width="512" height="7" rx="3" fill="#b86d55"/><text x="882" y="820" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">ڕاهێنان</text><path d="M647 836 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="860" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">سێ شتی ماڵ بنووسە.</text><text x="882" y="899" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">سێ شتی قوتابخانە بنووسە.</text><text x="882" y="938" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">شوێنی شتێک بە ڕستە دیاری بکە.</text></g>
<text x="600" y="1095" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="17" fill="#64736b">کەژیار • فێربوونی زمانی کوردی بە نموونەی ڕۆژانە</text>
