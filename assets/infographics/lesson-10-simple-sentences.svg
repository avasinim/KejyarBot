<text x="600" y="91" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="34" font-weight="700" fill="#fffaf0">وانەی ١٠: ڕستەی سادە و پرسیارکردن</text>
