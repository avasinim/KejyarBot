<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-label="وانەی ١٠: ڕستەی سادە و پرسیارکردن">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f5ed"/><stop offset="1" stop-color="#edf0e5"/></linearGradient></defs>
<rect width="1200" height="1120" rx="32" fill="url(#bg)"/><rect x="24" y="24" width="1152" height="1072" rx="28" fill="none" stroke="#254b3f" stroke-width="3"/>
<rect x="32" y="32" width="1136" height="165" rx="24" fill="#254b3f"/>
<text x="600" y="91" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="34" font-weight="700" fill="#fffaf0">وانەی ١٠: ڕستەی سادە و پرسیارکردن</text>
<text x="600" y="139" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="22" fill="#e8d2a4">وشەکان ڕێک بخە و پرسیاری ڕوون دروست بکە</text>
<g><rect x="48" y="225" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="239" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="288" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">ڕستەی سادە</text><path d="M83 304 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="328" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">من قوتابیم.</text><text x="318" y="367" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ئێمە زمانی کوردی فێر دەبین.</text><text x="318" y="406" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ئەم سێوە سوورە.</text></g><g><rect x="612" y="225" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="239" width="512" height="7" rx="3" fill="#e9b85f"/><text x="882" y="288" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">وشەی پرسیار</text><path d="M647 304 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="328" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">کێ؟ — بۆ کەس</text><text x="882" y="367" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">چی؟ — بۆ شت و بابەت</text><text x="882" y="406" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">کوێ؟ — بۆ شوێن • کەی؟ — بۆ کات</text></g><g><rect x="48" y="491" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="505" width="512" height="7" rx="3" fill="#b86d55"/><text x="318" y="554" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">پرسیار و وەڵام</text><path d="M83 570 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="594" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ناوت چییە؟ — ناوم ئارامە.</text><text x="318" y="633" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ئەمە چییە؟ — ئەمە کتێبە.</text><text x="318" y="672" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ئەو کێیە؟ — ئەو مامۆستاکەمانە.</text></g><g><rect x="612" y="491" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="505" width="512" height="7" rx="3" fill="#7699a0"/><text x="882" y="554" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">شوێن و کات</text><path d="M647 570 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="594" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">کتێبەکە لە کوێیە؟</text><text x="882" y="633" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">لەسەر مێزەکەیە.</text><text x="882" y="672" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">کەی دەچیتە قوتابخانە؟</text></g><g><rect x="48" y="757" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="771" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="820" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">گفتوگۆ</text><path d="M83 836 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="860" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">— ئەمە چییە؟</text><text x="318" y="899" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">— ئەمە دەفتەرە.</text><text x="318" y="938" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">— دەفتەرەکە لە کوێیە؟</text></g><g><rect x="612" y="757" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="771" width="512" height="7" rx="3" fill="#b86d55"/><text x="882" y="820" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">ڕاهێنان</text><path d="M647 836 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="860" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">سێ ڕستەی تەواو بنووسە.</text><text x="882" y="899" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">پرسیارێک بە «کێ؟» دروست بکە.</text><text x="882" y="938" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">گفتوگۆیەکی چوار ڕستەیی بنووسە.</text></g>
<text x="600" y="1095" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="17" fill="#64736b">کەژیار • فێربوونی زمانی کوردی بە نموونەی ڕۆژانە</text>
