<g><rect x="48" y="225" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="239" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="287" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">ڕستەی سادە</text><path d="M83 303 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="326" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">من قوتابیم.</text><text x="318" y="360" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">ئێمە زمانی کوردی فێر دەبین.</text><text x="318" y="394" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">ئەم سێوە سوورە.</text><text x="318" y="428" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">من هەموو ڕۆژێک دەخوێنم.</text></g><g><rect x="612" y="225" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="239" width="512" height="7" rx="3" fill="#e9b85f"/><text x="882" y="287" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">وشەی پرسیار</text><path d="M647 303 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="326" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">کێ؟ — بۆ کەس</text><text x="882" y="360" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">چی؟ — بۆ شت و بابەت</text><text x="882" y="394" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">کوێ؟ — بۆ شوێن</text><text x="882" y="428" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">کەی؟ — بۆ کات</text></g><g><rect x="48" y="509" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="523" width="512" height="7" rx="3" fill="#b86d55"/><text x="318" y="571" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">پرسیار و وەڵام</text><path d="M83 587 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="610" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">ناوت چییە؟ — ناوم ئارامە.</text><text x="318" y="644" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">ئەمە چییە؟ — ئەمە کتێبە.</text><text x="318" y="678" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">ئەو کێیە؟ — ئەو مامۆستاکەمانە.</text><text x="318" y="712" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">کتێبەکە لە کوێیە؟ — لەسەر مێزەکەیە.</text></g><g><rect x="612" y="509" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="523" width="512" height="7" rx="3" fill="#7699a0"/><text x="882" y="571" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">شوێن و کات</text><path d="M647 587 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="610" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">کتێبەکە لە کوێیە؟</text><text x="882" y="644" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">لەسەر مێزەکەیە.</text><text x="882" y="678" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">کەی دەچیتە قوتابخانە؟</text><text x="882" y="712" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">بەیانی دەچم.</text></g><g><rect x="48" y="793" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="807" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="855" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">گفتوگۆ</text><path d="M83 871 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="894" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">— ئەمە چییە؟</text><text x="318" y="928" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">— ئەمە دەفتەرە.</text><text x="318" y="962" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">— دەفتەرەکە لە کوێیە؟</text><text x="318" y="996" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">— لە ناو جانتاکەدایە.</text></g><g><rect x="612" y="793" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="807" width="512" height="7" rx="3" fill="#b86d55"/><text x="882" y="855" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">ڕاهێنان</text><path d="M647 871 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="894" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">سێ ڕستەی تەواو بنووسە.</text><text x="882" y="928" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">پرسیارێک بە «کێ؟» دروست بکە.</text><text x="882" y="962" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">پرسیارێک بە «کوێ؟» بنووسە.</text><text x="882" y="996" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">گفتوگۆیەکی چوار ڕستەیی بنووسە.</text></g>
<text x="600" y="1185" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="17" fill="#64736b">کەژیار • فێربوونی زمانی کوردی بە نموونەی ڕۆژانە</text>
