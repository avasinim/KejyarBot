abic, sans-serif" font-size="21" fill="#4c5b53">کەسێک بە دوو ڕستە بناسێنە.</text><text x="882" y="938" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="18" fill="#4c5b53">ئەگەر پێویست بوو، خێزانێکی خەیاڵی دروست بکە.</text></g>
