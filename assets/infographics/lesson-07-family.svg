ily="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">ئەوە باوکمە.</text><text x="882" y="394" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">براکەم قوتابییە.</text><text x="882" y="428" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">خوشکەکەم ناوی نازدارە.</text></g><g><rect x="48" y="509" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="523" width="512" height="7" rx="3" fill="#b86d55"/><text x="318" y="571" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">خێزان لە ڕستەدا</text><path d="M83 587 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="610" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">ئەوان ئەندامی خێزانەکەمن.</text><text x="318" y="644" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">خێزانەکە لە شارەکەدا دەژیت.</text><text x="318" y="678" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">دایکم لە ماڵەوەیە.</text><text x="318" y="712" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">باپیر و داپیرم لێرەن.</text></g><g><rect x="612" y="509" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="523" width="512" height="7" rx="3" fill="#7699a0"/><text x="882" y="571" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">پرسیارکردن</text><path d="M647 587 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="610" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">ئەمە کێیە؟</text><text x="882" y="644" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">ناوی ئەو چییە؟</text><text x="882" y="678" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">چەند خوشکت هەیە؟</text><text x="882" y="712" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">کێ لە قوتابخانە دەخوێنێت؟</text></g><g><rect x="48" y="793" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="807" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="855" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">گفتوگۆ</text><path d="M83 871 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="894" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">— ئەمە کێیە؟</text><text x="318" y="928" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">— ئەمە خوشکمە.</text><text x="318" y="962" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">— ناوی ئەو چییە؟</text><text x="318" y="996" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">— ناوی ئەو شیرینە.</text></g><g><rect x="612" y="793" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="807" width="512" height="7" rx="3" fill="#b86d55"/><text x="882" y="855" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">ڕاهێنان</text><path d="M647 871 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="894" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">پێنج وشەی خێزان بنووسە.</text><text x="882" y="928" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">کەسێک بە دوو ڕستە بناسێنە.</text><text x="882" y="962" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">پرسیارێک بە «کێ؟» دروست بکە.</text><text x="882" y="996" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">خێزانێکی خەیاڵی وەسف بکە.</text></g>
