<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-label="وانەی ٨: خواردن و خواردنەوە">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f5ed"/><stop offset="1" stop-color="#edf0e5"/></linearGradient></defs>
<rect width="1200" height="1120" rx="32" fill="url(#bg)"/><rect x="24" y="24" width="1152" height="1072" rx="28" fill="none" stroke="#254b3f" stroke-width="3"/>
<rect x="32" y="32" width="1136" height="165" rx="24" fill="#254b3f"/>
<text x="600" y="91" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">وانەی ٨: خواردن و خواردنەوە</text>
<text x="600" y="139" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="22" fill="#e8d2a4">وشەکان لە داواکاری و گفتوگۆی ڕۆژانەدا بەکاربهێنە</text>
<g><rect x="48" y="225" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="239" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="288" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">وشەی خواردن</text><path d="M83 304 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="328" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">نان • برنج • شۆربا</text><text x="318" y="367" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">سێو • هێلکە • پەنیر</text><text x="318" y="406" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">خواردن • میوە</text></g><g><rect x="612" y="225" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="239" width="512" height="7" rx="3" fill="#e9b85f"/><text x="882" y="288" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">خواردنەوە</text><path d="M647 304 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="328" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ئاو • چای • شیر</text><text x="882" y="367" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">پەرداخێک ئاو</text><text x="882" y="406" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">چایەک، تکایە.</text></g><g><rect x="48" y="491" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="505" width="512" height="7" rx="3" fill="#b86d55"/><text x="318" y="554" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">ڕستەی نموونە</text><path d="M83 570 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="594" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">بۆ بەیانی نان و پەنیر دەخۆم.</text><text x="318" y="633" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">شۆرباکە گەرمە.</text><text x="318" y="672" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ئاو دەخۆمەوە، نەک چای.</text></g><g><rect x="612" y="491" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="505" width="512" height="7" rx="3" fill="#7699a0"/><text x="882" y="554" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">داواکاریی ڕێزدارانە</text><path d="M647 570 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="594" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">تکایە، پەرداخێک ئاو بدە.</text><text x="882" y="633" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">شتێکی تر دەتەوێت؟</text><text x="882" y="672" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">نەخێر، زۆر سوپاس.</text></g><g><rect x="48" y="757" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="771" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="820" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">گفتوگۆ</text><path d="M83 836 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="860" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">— چی دەتەوێت؟</text><text x="318" y="899" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">— ئاوێک و پارچە نانێک.</text><text x="318" y="938" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">— بەخۆشی بخۆیت.</text></g><g><rect x="612" y="757" width="540" height="244" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="771" width="512" height="7" rx="3" fill="#b86d55"/><text x="882" y="820" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" font-weight="700" fill="#254b3f">ڕاهێنان</text><path d="M647 836 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="860" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">سێ خواردن و سێ خواردنەوە بنووسە.</text><text x="882" y="899" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">ڕستەیەک بە «دەخۆم» دروست بکە.</text><text x="882" y="938" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="21" fill="#4c5b53">داواکارییەک لە خواردنگەدا بکە.</text></g>
<text x="600" y="1095" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="17" fill="#64736b">کەژیار • فێربوونی زمانی کوردی بە نموونەی ڕۆژانە</text>
</svg>