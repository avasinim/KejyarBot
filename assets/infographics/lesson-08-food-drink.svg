<g><rect x="48" y="225" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="239" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="287" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">وشەی خواردن</text><path d="M83 303 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="326" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">نان • برنج • شۆربا</text><text x="318" y="360" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">سێو • هێلکە • پەنیر</text><text x="318" y="394" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">تەماتە • میوە • خواردن</text><text x="318" y="428" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">نانی بەیانی • نانی ئێوارە</text></g><g><rect x="612" y="225" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="239" width="512" height="7" rx="3" fill="#e9b85f"/><text x="882" y="287" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">خواردنەوە</text><path d="M647 303 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="326" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">ئاو • چای • شیر</text><text x="882" y="360" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">پەرداخێک ئاو</text><text x="882" y="394" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">چایەک، تکایە.</text><text x="882" y="428" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">شیرەکە ساردە، چایەکە گەرمە.</text></g><g><rect x="48" y="509" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="523" width="512" height="7" rx="3" fill="#b86d55"/><text x="318" y="571" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">ڕستەی نموونە</text><path d="M83 587 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="610" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">بۆ بەیانی نان و پەنیر دەخۆم.</text><text x="318" y="644" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">شۆرباکە گەرمە.</text><text x="318" y="678" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">ئاو دەخۆمەوە، نەک چای.</text><text x="318" y="712" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">سێوەکە شیرینە و پرتەقاڵەکە ترشە.</text></g><g><rect x="612" y="509" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="523" width="512" height="7" rx="3" fill="#7699a0"/><text x="882" y="571" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">داواکاریی ڕێزدارانە</text><path d="M647 587 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="610" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">تکایە، پەرداخێک ئاو بدە.</text><text x="882" y="644" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">شتێکی تر دەتەوێت؟</text><text x="882" y="678" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">نەخێر، زۆر سوپاس.</text><text x="882" y="712" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">تکایە، لیستی خواردنەکانم پێ بدە.</text></g><g><rect x="48" y="793" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="62" y="807" width="512" height="7" rx="3" fill="#8ba58a"/><text x="318" y="855" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">گفتوگۆ</text><path d="M83 871 H553" stroke="#e5dfd1" stroke-width="1.5"/><text x="318" y="894" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">— چی دەتەوێت؟</text><text x="318" y="928" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">— ئاوێک و پارچە نانێک.</text><text x="318" y="962" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">— شتێکی تر دەتەوێت؟</text><text x="318" y="996" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">— نەخێر، زۆر سوپاس.</text></g><g><rect x="612" y="793" width="540" height="264" rx="24" fill="#fffdf8" stroke="#d7c8a6" stroke-width="2"/><rect x="626" y="807" width="512" height="7" rx="3" fill="#b86d55"/><text x="882" y="855" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" font-weight="700" fill="#254b3f">ڕاهێنان</text><path d="M647 871 H1117" stroke="#e5dfd1" stroke-width="1.5"/><text x="882" y="894" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">سێ خواردن و سێ خواردنەوە بنووسە.</text><text x="882" y="928" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">ڕستەیەک بە «دەخۆم» دروست بکە.</text><text x="882" y="962" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">داواکارییەک لە خواردنگەدا بکە.</text><text x="882" y="996" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="20" fill="#4c5b53">خواردنێک بە دوو ڕستە وەسف بکە.</text></g>
<text x="600" y="1185" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="17" fill="#64736b">کەژیار • فێربوونی زمانی کوردی بە نموونەی ڕۆژانە</text>
