<rect x="32" y="32" width="1136" height="165" rx="24" fill="#254b3f"/>
<text x="600" y="91" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">وانەی ٨: خواردن و خواردنەوە</text>
