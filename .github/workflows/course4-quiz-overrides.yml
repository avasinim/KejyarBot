name: Course 4 quiz override validation

on:
  push:
    branches:
      - feature/course4-quiz-overrides-2026-11-10
      - feature/course4-quiz-overrides-lesson31-2026-11-10
      - review/course4-terminology-normalization-round2-2026-11-10

permissions:
  contents: read

jobs:
  course4-quiz-override-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
