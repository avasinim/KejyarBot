name: Python checks

on:
  push:
    branches: ["main", "fix/**", "feat/**", "work/**", "botkeep-runtime-2026-11-09"]
  pull_request:
    branches: ["main", "botkeep-runtime-2026-11-09"]

# This workflow only reads source files and runs tests; no write permissions are needed.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
