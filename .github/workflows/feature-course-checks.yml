name: KejyarBot feature-branch checks

on:
  push:
    branches:
      - "feature/four-course-structure-2026-10-26"
  pull_request:
    branches:
      - "main"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
