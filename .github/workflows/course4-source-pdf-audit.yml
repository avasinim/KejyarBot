name: Course 4 source PDF audit

on:
  push:
    branches:
      - audit/course4-source-pdf-extraction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/course4-source-pdf-extraction
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF parser
        run: python -m pip install --upgrade pymupdf
      - name: Download and index the five source volumes
        run: python tools/course4_source_audit/extract_books.py
      - name: Upload page index
        uses: actions/upload-artifact@v4
        with:
          name: course4-source-pdf-index
          path: audit-output/manifest.json
          retention-days: 7
