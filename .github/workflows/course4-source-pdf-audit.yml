name: Course 4 source PDF cover audit

on:
  # Manual only: inspect the first five pages of each immutable source PDF.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cover-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/course4-source-pdf-extraction
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Arabic OCR engine
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara
      - name: Install bounded PDF tools
        run: python -m pip install --upgrade pymupdf pillow pytesseract
      - name: Validate provisional lesson-to-volume map
        run: python tools/course4_source_audit/validate_mapping.py
      - name: Verify source PDFs and inspect first five pages only
        run: python tools/course4_source_audit/extract_covers.py
      - name: Upload cover images and OCR text
        uses: actions/upload-artifact@v4
        with:
          name: course4-source-cover-audit
          path: cover-audit/
          retention-days: 7
