name: Course 4 source PDF audit

on:
  push:
    branches:
      - audit/course4-source-pdf-extraction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/course4-source-pdf-extraction
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Arabic OCR engine
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara
      - name: Install PDF and OCR libraries
        run: python -m pip install --upgrade pymupdf pillow pytesseract
      - name: Download, verify, and OCR the five source volumes
        run: python tools/course4_source_audit/extract_books.py
      - name: Upload page index and short lesson excerpts
        uses: actions/upload-artifact@v4
        with:
          name: course4-source-pdf-audit
          path: audit-output/
          retention-days: 7
