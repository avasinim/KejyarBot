name: Course 4 runtime tests

on:
  push:
    branches:
      - feat/course4-owner-review-beta-sync-20261106
    paths:
      - 'course_data/grammar_course4_lessons_01_08.json'
      - 'course_lesson_adapters.py'
      - 'bot.py'
      - 'tests/test_course4_runtime.py'
      - '.github/workflows/course4-runtime-tests.yml'
  pull_request:
    paths:
      - 'course_data/grammar_course4_lessons_01_08.json'
      - 'course_lesson_adapters.py'
      - 'bot.py'
      - 'tests/test_course4_runtime.py'
      - '.github/workflows/course4-runtime-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course4-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Course 4 regression tests
        run: python -m unittest discover -s tests -p 'test_course4_runtime.py' -v
