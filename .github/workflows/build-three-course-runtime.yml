name: Build three-course KejyarBot runtime package

on:
  push:
    branches: ["work/three-courses-runtime-nov14-base-2026-11-15"]
    paths:
      - ".github/workflows/build-three-course-runtime.yml"
      - "bot.py"
      - "courses.json"
      - "latin_course_runtime.py"
      - "course_data/**"
      - "*_runtime.py"
      - "*_telegram.py"
      - "database.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate three-course runtime and build archive
        run: |
          python -m compileall -q bot.py database.py daily_chat.py course_runtime.py course_lesson_adapters.py course_quiz_review.py quiz_option_order.py latin_course_runtime.py arami_course1_runtime.py arami_course1_telegram.py arami_lesson1_interaction.py arami_lesson1_telegram.py arami_lesson5_telegram.py lesson_image_delivery.py kurdish_months.py
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          from arami_course1_runtime import (
              load_arami_course1_manifest, load_arami_course1_question_banks,
              load_arami_lesson1_content, load_arami_lesson1_interactions,
              load_arami_lesson5_interactions, load_arami_lesson5_source,
          )
          from course_lesson_adapters import adapt_unified_orthography_lessons
          from latin_course_runtime import load_latin_courses

          root = pathlib.Path.cwd()
          allowed = {
              "arami_orthography_foundations",
              "kurmanji_latin_orthography",
              "unified_orthography",
          }
          courses = json.loads((root / "courses.json").read_text(encoding="utf-8"))["courses"]
          assert {c["id"] for c in courses} == allowed and len(courses) == 3
          latin_manifest = json.loads((root / "course_data/latin_courses_manifest_draft.json").read_text(encoding="utf-8"))
          assert [c["id"] for c in latin_manifest["courses"]] == ["kurmanji_latin_orthography"]

          arami = load_arami_course1_manifest(root)
          assert len(arami["lessons"]) == 21
          banks = load_arami_course1_question_banks(root)
          assert len(banks) == 19
          assert load_arami_lesson1_content(root)
          assert load_arami_lesson1_interactions(root)
          assert load_arami_lesson5_interactions(root)
          assert load_arami_lesson5_source(root)

          unified_raw = json.loads((root / "course_data/unified_orthography_lessons_01_66.json").read_text(encoding="utf-8"))
          unified_lessons, unified_quizzes = adapt_unified_orthography_lessons(unified_raw)
          assert len(unified_lessons) == 66 and len(unified_quizzes) == 66

          latin_lessons, latin_quizzes, latin_records = load_latin_courses()
          assert len(latin_lessons) == 12 and len(latin_quizzes) == 12
          assert [c["id"] for c in latin_records] == ["kurmanji_latin_orthography"]

          paths = [
              "bot.py", "database.py", "daily_chat.py", "course_runtime.py",
              "course_lesson_adapters.py", "course_quiz_review.py", "quiz_option_order.py",
              "latin_course_runtime.py", "arami_course1_runtime.py", "arami_course1_telegram.py",
              "arami_lesson1_interaction.py", "arami_lesson1_telegram.py", "arami_lesson5_telegram.py",
              "lesson_image_delivery.py", "kurdish_months.py", "requirements.txt", "courses.json",
              "course_data/arami_course1_manifest.json",
              "course_data/arami_course1_lesson_01_interactions.json",
              "course_data/arami_course1_lesson_05_interactions.json",
              "course_data/arami_course1_source_quiz_banks.json",
              "course_data/latin_courses_manifest_draft.json",
              "course_data/latin_course_1_source_aligned_lessons_01_12.md",
              "course_data/latin_course_1_quiz_answer_key_draft.md",
              "course_data/unified_orthography_lessons_01_66.json",
          ]
          paths += [lesson["content_file"] for lesson in arami["lessons"] if lesson.get("content_file")]
          paths = list(dict.fromkeys(paths))
          missing = [p for p in paths if not (root / p).is_file()]
          if missing:
              raise SystemExit("Missing runtime files: " + repr(missing))
          forbidden = [p for p in paths if "grammar_course4" in p or "latin_course_2" in p or "daily_conversation_lessons" in p or p.startswith("assets/")]
          if forbidden:
              raise SystemExit("Out-of-scope or image files found: " + repr(forbidden))

          archive = root / "KejyarBot-three-courses-runtime.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in paths:
                  z.write(root / p, p)
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert len(names) == len(paths) and set(names) == set(paths)
          report = {
              "archive": archive.name,
              "file_count": len(paths),
              "courses": sorted(allowed),
              "lesson_counts": {"arami": 21, "latin_course_1": 12, "unified": 66},
              "images_included": 0,
              "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "files": paths,
          }
          (root / "three-course-package-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KejyarBot-three-courses-runtime
          path: |
            KejyarBot-three-courses-runtime.zip
            three-course-package-report.json
          if-no-files-found: error
          retention-days: 7
