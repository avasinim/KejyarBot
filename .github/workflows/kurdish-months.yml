name: Kurdish months tests

on:
  pull_request:
    paths:
      - "kurdish_months.py"
      - "tests/test_kurdish_months.py"
      - ".github/workflows/kurdish-months.yml"
  push:
    branches:
      - "feat/kurdish-months-cultural-menu-2026-11-04"
    paths:
      - "kurdish_months.py"
      - "tests/test_kurdish_months.py"
      - ".github/workflows/kurdish-months.yml"

jobs:
  test-kurdish-months:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telegram library used by the menu module
        run: python -m pip install "python-telegram-bot==22.8"
      - name: Run Kurdish month data tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_kurdish_months.py" -v
